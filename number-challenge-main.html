<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ナンプレ（数独）</title>
    <style>
       body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #090909;
    color: #f5f5f5;
}


/* タイトル */
h1 {
    margin-bottom: 20px;
    color: #d4af37;
}


/* 数独盤 */
#sudoku {

    display: grid;
    grid-template-columns: repeat(9, 40px);
    grid-gap: 2px;

    margin: 0 auto;
    max-width: 360px;

    padding: 10px;

    background: rgba(20,20,20,0.9);

    border:2px solid #d4af37;

    box-shadow:
    0 0 20px rgba(212,175,55,0.25);

}


/* マス */
.cell {

    width:40px;
    height:40px;

    background:#111;

    border:1px solid rgba(212,175,55,0.5);

    font-size:20px;

    text-align:center;
    line-height:40px;

    color:#fff;

}


/* 入力欄 */
.cell input {

    width:100%;
    height:100%;

    border:none;

    text-align:center;

    font-size:20px;

    background:transparent;

    color:#f5d36a;

}


.cell input:focus {

    outline:none;

    background:rgba(212,175,55,0.08);

}


/* 固定数字 */
.fixed {

    background:

    linear-gradient(
        145deg,
        #2a2108,
        #171000
    );

    color:#d4af37;

    font-weight:bold;

}


/* ボタンエリア */
#controls {

    margin-top:20px;

}


/* ボタン */
button {

    margin:5px;

    padding:10px 20px;

    font-size:16px;

    background:#d4af37;

    color:#090909;

    border:none;

    cursor:pointer;

    font-weight:bold;

    border-radius:6px;

    transition:.3s;

}


button:hover {

    background:#f5d36a;

    box-shadow:
    0 0 15px rgba(212,175,55,0.7);

}



/* 過去結果 */
#previousResultsTable {

    margin-top:20px;

    display:none;

}



table {

    width:50%;

    margin:20px auto;

    border-collapse:collapse;

    color:#fff;

}



th,td {

    padding:10px;

    border:1px solid rgba(212,175,55,0.4);

    text-align:center;

}



th {

    background:#1a1505;

    color:#d4af37;

}



/* 難易度 */
.difficulty-options {

    display:flex;

    justify-content:center;

    margin-bottom:10px;

}


.difficulty-options label {

    margin:0 10px;

    color:#ddd;

}


/* =====================
   フッター 黒金
===================== */


.sudoku-footer {


    background:

    linear-gradient(
        180deg,
        #161616,
        #050505
    );


    border-top:

    2px solid #d4af37;


}



.sudoku-footer .footer-divider {


    background:#d4af37;


}



.site-footer {


    margin-top:60px;


    width:100%;


    padding:35px 20px;


    text-align:center;


    box-sizing:border-box;


    color:#fff;


}



.footer-inner {


    max-width:1100px;


    margin:auto;


}



.footer-divider {


    width:90px;


    height:2px;


    margin:20px auto;


}



.footer-title {


    margin-top:8px;

    color:#d4af37;

}



.footer-message {


    margin:15px 0;

    color:#ddd;

}



.footer-inner small {


    display:block;

    line-height:1.8;

    color:#aaa;

}

    </style>
</head>
<body>
    <h1>ナンプレ（数独）</h1>
    <div id="sudoku"></div>

    <div id="controls">
        <div class="difficulty-options">
            <label><input type="radio" name="difficulty" value="easy" checked>下級</label>
            <label><input type="radio" name="difficulty" value="medium">中級</label>
            <label><input type="radio" name="difficulty" value="hard">上級</label>
        </div>
        <button onclick="resetGame()">リセット</button>
        <button onclick="restartGame()">リスタート</button>
        <button onclick="showHint()">ヒント</button>
        <button onclick="showSolution()">模範解答表示</button>
        <button onclick="saveProgress()">作業保存</button>
        <button onclick="showPreviousResults()">過去の結果を表示</button>
    </div>

    <h2>過去のゲーム結果</h2>
    <table id="previousResultsTable">
        <thead>
            <tr>
                <th>ゲーム回数</th>
                <th>状態</th>
            </tr>
        </thead>
        <tbody id="previousResultBody">
        </tbody>
    </table>

    <script>
        let sudokuBoard = [];
        let initialBoard = [];
        let solutionBoard = [];
        let previousResults = JSON.parse(localStorage.getItem('sudokuResults')) || [];
        let currentGameNumber = previousResults.length + 1;
        let difficulty = 'easy'; // デフォルトの難易度

        function createBoard() {
            const sudokuDiv = document.getElementById('sudoku');
            sudokuDiv.innerHTML = '';

            for (let i = 0; i < 9; i++) {
                sudokuBoard[i] = [];
                initialBoard[i] = [];
                solutionBoard[i] = [];
                for (let j = 0; j < 9; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.dataset.row = i;
                    input.dataset.col = j;
                    input.addEventListener('input', validateInput);

                    cell.appendChild(input);
                    sudokuDiv.appendChild(cell);

                    sudokuBoard[i][j] = 0;
                    initialBoard[i][j] = 0;
                }
            }

            // 難易度を取得
            difficulty = document.querySelector('input[name="difficulty"]:checked').value;

            // 一部のセルに初期値を設定（固定セル）
            setInitialValues();
        }

        function generateSolvedBoard() {
            const board = Array.from({ length: 9 }, () => Array(9).fill(0));
            fillBoard(board);
            return board;
        }

        function fillBoard(board) {
            function isValid(board, row, col, num) {
                for (let i = 0; i < 9; i++) {
                    if (board[row][i] === num || board[i][col] === num) {
                        return false;
                    }
                }
                const startRow = Math.floor(row / 3) * 3;
                const startCol = Math.floor(col / 3) * 3;
                for (let i = startRow; i < startRow + 3; i++) {
                    for (let j = startCol; j < startCol + 3; j++) {
                        if (board[i][j] === num) {
                            return false;
                        }
                    }
                }
                return true;
            }

            function solve(board) {
                for (let row = 0; row < 9; row++) {
                    for (let col = 0; col < 9; col++) {
                        if (board[row][col] === 0) {
                            for (let num = 1; num <= 9; num++) {
                                if (isValid(board, row, col, num)) {
                                    board[row][col] = num;
                                    if (solve(board)) {
                                        return true;
                                    } else {
                                        board[row][col] = 0; // バックトラック
                                    }
                                }
                            }
                            return false; // 解が見つからなかった場合
                        }
                    }
                }
                return true; // 全てのセルが埋まった場合
            }

            solve(board);
        }

        function generateRandomInitialValues() {
            const solvedBoard = generateSolvedBoard();
            const initialValues = Array.from({ length: 9 }, () => Array(9).fill(0));
            let filledCells = 0;
            let maxCells;

            // 難易度に応じて初期値の数を設定
            switch (difficulty) {
                case 'easy':
                    maxCells = 20;
                    break;
                case 'medium':
                    maxCells = 15;
                    break;
                case 'hard':
                    maxCells = 10;
                    break;
                default:
                    maxCells = 20;
            }

            while (filledCells < maxCells) {
                const row = Math.floor(Math.random() * 9);
                const col = Math.floor(Math.random() * 9);
                if (initialValues[row][col] === 0) {
                    initialValues[row][col] = solvedBoard[row][col];
                    filledCells++;
                }
            }

            return initialValues;
        }

      function setInitialValues() {
    const solvedBoard = generateSolvedBoard();
    const initialValues = generateRandomInitialValues();
    for (let i = 0; i < 9; i++) {
        for (let j = 0; j < 9; j++) {
            solutionBoard[i][j] = solvedBoard[i][j];
            if (initialValues[i][j] !== 0) {
                const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`); // 修正箇所
                cell.value = initialValues[i][j];
                cell.disabled = true;
                cell.parentElement.classList.add('fixed');
                sudokuBoard[i][j] = initialValues[i][j];
                initialBoard[i][j] = initialValues[i][j];
            }
        }
    }
}

    function validateInput(e) {
        const input = e.target;
        const value = parseInt(input.value);
        const row = parseInt(input.dataset.row);
        const col = parseInt(input.dataset.col);

        if (isNaN(value) || value < 1 || value > 9) {
            input.value = '';
            return;
        }

        // 同じ行、列、3x3ブロックに同じ数字がないか検証
        if (!isValidMove(row, col, value)) {
            input.value = '';
            return;
        }

        sudokuBoard[row][col] = value;
        checkGameCompletion(); // ゲーム完了判定
    }

    function isValidMove(row, col, num) {
        // 同じ行に同じ数字がないかチェック
        for (let i = 0; i < 9; i++) {
            if (i !== col && sudokuBoard[row][i] === num) {
                return false;
            }
        }

        // 同じ列に同じ数字がないかチェック
        for (let i = 0; i < 9; i++) {
            if (i !== row && sudokuBoard[i][col] === num) {
                return false;
            }
        }

        // 同じ3x3ブロックに同じ数字がないかチェック
        const startRow = Math.floor(row / 3) * 3;
        const startCol = Math.floor(col / 3) * 3;
        for (let i = startRow; i < startRow + 3; i++) {
            for (let j = startCol; j < startCol + 3; j++) {
                if (i !== row && j !== col && sudokuBoard[i][j] === num) {
                    return false;
                }
            }
        }

        return true;
    }

    function checkGameCompletion() {
        for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
                if (sudokuBoard[i][j] === 0) {
                    return; // まだ未入力のセルがある場合は完了していない
                }
            }
        }
        alert('ゲーム完了！おめでとうございます！');
    }

    function resetGame() {
        if (confirm('リセットしますか？進行中のゲームが失われます。')) {
            createBoard();
        }
    }

    function restartGame() {
        if (confirm('リスタートしますか？進行中のゲームが失われます。')) {
            sudokuBoard = initialBoard.map(arr => arr.slice());
            updateBoard();
        }
    }

    function updateBoard() {
        for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
                const input = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
                if (!input.disabled) {
                    input.value = sudokuBoard[i][j] || '';
                }
            }
        }
    }

    function showHint() {
        let emptyCells = [];
        for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
                if (sudokuBoard[i][j] === 0) {
                    emptyCells.push({ row: i, col: j });
                }
            }
        }

        if (emptyCells.length > 0) {
            const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const correctValue = solutionBoard[randomCell.row][randomCell.col];
            const input = document.querySelector(`[data-row="${randomCell.row}"][data-col="${randomCell.col}"]`);
            input.value = correctValue;
            sudokuBoard[randomCell.row][randomCell.col] = correctValue;
            checkGameCompletion(); // ゲーム完了判定
        } else {
            alert('ヒントが見つかりません。');
        }
    }

    function showSolution() {
        if (confirm('模範解答を表示しますか？現在の進行は失われます。')) {
            sudokuBoard = solutionBoard.map(arr => arr.slice());
            updateBoard();
            checkGameCompletion(); // ゲーム完了判定
        }
    }

    function saveProgress() {
        localStorage.setItem('sudokuProgress', JSON.stringify(sudokuBoard));
        saveResult('進行中');
        alert('ゲームが保存されました。');
    }

    function saveResult(status) {
        previousResults.push({
            gameNumber: currentGameNumber,
            status: status
        });
        localStorage.setItem('sudokuResults', JSON.stringify(previousResults));
        currentGameNumber++;
    }

    function showPreviousResults() {
        const tableBody = document.getElementById('previousResultBody');
        tableBody.innerHTML = '';

        previousResults.forEach(result => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${result.gameNumber}</td><td>${result.status}</td>`;
            tableBody.appendChild(row);
        });

        document.getElementById('previousResultsTable').style.display = 'table';
    }

    window.onload = function() {
        const savedProgress = localStorage.getItem('sudokuProgress');
        if (savedProgress) {
            sudokuBoard = JSON.parse(savedProgress);
            initialBoard = sudokuBoard.map(arr => arr.slice());
            updateBoard();
            checkGameCompletion(); // ゲーム完了判定
        } else {
            createBoard();
        }

        showPreviousResults();
    };
</script>

</footer>
</body>
